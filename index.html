</style></head><body>
<header><h1>命 나의 사주 운세</h1><div id="me"></div></header>
<nav><div><button data-t="today" onclick="tab('today')">오늘</button><button data-t="ny" onclick="tab('ny')">신년운세</button><button data-t="chart" onclick="tab('chart')">원국</button><button data-t="pr" onclick="tab('pr')">종합풀이</button><button data-t="luck" onclick="tab('luck')">대운·세운</button><button data-t="cal" onclick="tab('cal')">달력</button><button data-t="gh" onclick="tab('gh')">궁합</button><button data-t="set" onclick="tab('set')">설정</button></div></nav>
<main><section id="today"></section><section id="ny" hidden></section><section id="chart" hidden></section><section id="pr" hidden></section><section id="luck" hidden></section><section id="cal" hidden></section><section id="gh" hidden></section><section id="set" hidden></section></main>
<div id="modal" hidden onclick="if(event.target.id==='modal')closeM()"><div class="sheet"><button class="x" onclick="closeM()">✕</button><div id="mbody"></div></div></div>
<script>
// ===== 사주 계산 엔진 =====
const STEMS='甲乙丙丁戊己庚辛壬癸', STEMS_K='갑을병정무기경신임계';
const BRS='子丑寅卯辰巳午未申酉戌亥', BRS_K='자축인묘진사오미신유술해';
const EL_K=['목','화','토','금','수'], EL_H=['木','火','土','金','水'];
const BR_EL=[4,2,0,0,2,1,1,2,3,3,2,4];
const BR_MAIN=[9,5,0,1,4,2,3,5,6,7,4,8];
const HIDDEN=[[8,9],[9,7,5],[4,2,0],[0,1],[1,9,4],[4,6,2],[2,5,3],[3,1,5],[4,8,6],[6,7],[7,3,4],[4,0,8]];
const ANIMALS='쥐소호랑이토끼용뱀말양원숭이닭개돼지';
const ANIMAL_LIST=['쥐','소','호랑이','토끼','용','뱀','말','양','원숭이','닭','개','돼지'];
const UNSEONG=['장생','목욕','관대','건록','제왕','쇠','병','사','묘','절','태','양'];
const UNSEONG_START=[11,6,2,9,2,9,5,0,8,3];
const TG=['비견','겁재','식신','상관','편재','정재','편관','정관','편인','정인'];
const stemEl=s=>Math.floor(s/2);
const mod=(a,n)=>((a%n)+n)%n;

function jdUT(y,m,d,h){ if(m<=2){y--;m+=12}
  const A=Math.floor(y/100),B=2-A+Math.floor(A/4);
  return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5+h/24; }
function jdToDate(jd){ return new Date((jd-2440587.5)*86400000); }
function sunLon(jd){ const T=(jd-2451545)/36525, r=Math.PI/180;
  const L0=280.46646+36000.76983*T+0.0003032*T*T;
  const M=357.52911+35999.05029*T-0.0001537*T*T;
  const C=(1.914602-0.004817*T-0.000014*T*T)*Math.sin(M*r)+(0.019993-0.000101*T)*Math.sin(2*M*r)+0.000289*Math.sin(3*M*r);
  const Om=125.04-1934.136*T;
  return mod(L0+C-0.00569-0.00478*Math.sin(Om*r),360); }
function termJD(target,guess){ let jd=guess;
  for(let i=0;i<60;i++){ const diff=mod(target-sunLon(jd)+180,360)-180; jd+=diff/0.98564736; if(Math.abs(diff)<1e-7)break; }
  return jd; }
// 한국 표준시 오프셋(시간) — 역사적 변경 및 서머타임 반영
function krOffset(y,m,d){
  const v=y*10000+m*100+d;
  let off=9;
  if(v>=19540321 && v<19610810) off=8.5;
  const dst=[[19480601,19480913],[19490403,19490911],[19500401,19500910],[19510506,19510909],
    [19550505,19550909],[19560520,19560930],[19570505,19570922],[19580504,19580921],[19590503,19590920],[19600501,19600918],
    [19870510,19871011],[19880508,19881009]];
  for(const [a,b] of dst) if(v>=a&&v<b) off+=1;
  return off; }
const pillar=(s,b)=>({s,b});
const idx60=(s,b)=>{ for(let i=0;i<60;i++) if(i%10===s&&i%12===b) return i; return -1; };
const p60=i=>pillar(mod(i,10),mod(i,12));
function dayIdxFromYMD(y,m,d){ const jdn=Math.floor(jdUT(y,m,d,0)+0.5); return mod(jdn+49,60); }
function yearIdx(y){ return mod(y-4,60); }
function ipchunJD(y){ return termJD(315, jdUT(y,2,4,0)); }

function calcSaju(cfg){
  const {y,m,d,hh,mm,male,lon,useSolar,yajasi,unknownTime}=cfg;
  const off=(cfg.tz!=null&&cfg.tz!=='')?(+cfg.tz+(cfg.dst?1:0)):krOffset(y,m,d);
  const jd=jdUT(y,m,d,hh+mm/60-off);
  // 년주
  let sy=y; if(jd<ipchunJD(y)) sy=y-1;
  const yp=p60(yearIdx(sy));
  // 월주
  const L=sunLon(jd); const mi=Math.floor(mod(L-315,360)/30);
  const mp=pillar(mod((yp.s%5)*2+2+mi,10),mod(mi+2,12));
  // 시간 보정 (경도 기반 진태양시 근사)
  const corr=useSolar?(lon-off*15)*4:0; // 분
  const t=new Date(Date.UTC(y,m-1,d,hh,mm+Math.round(corr)));
  let ly=t.getUTCFullYear(),lm=t.getUTCMonth()+1,ld=t.getUTCDate(),lh=t.getUTCHours()+t.getUTCMinutes()/60;
  let di=dayIdxFromYMD(ly,lm,ld);
  if(yajasi==='23' && lh>=23) di=mod(di+1,60);
  const dp=p60(di);
  let hp=null;
  if(!unknownTime){ const hb=Math.floor((lh+1)/2)%12; const ds=(yajasi==='23'&&lh>=23)?dp.s:dp.s; hp=pillar(mod((ds%5)*2+hb,10),hb); }
  // 대운
  const forward=((yp.s%2===0)===male);
  const nextT=mod(315+30*(mi+1),360), prevT=mod(315+30*mi,360);
  const jNext=termJD(nextT, jd+mod(nextT-L,360)/0.9856);
  const jPrev=termJD(prevT, jd-mod(L-prevT,360)/0.9856);
  const days=forward?(jNext-jd):(jd-jPrev);
  const dwNum=Math.max(1,Math.round(days/3));
  const startJD=jd+days*120; // 1일=4개월
  const mIdx=idx60(mp.s,mp.b);
  const daewoon=[];
  for(let i=1;i<=10;i++){ const p=p60(mIdx+(forward?i:-i)); const sj=startJD+(i-1)*10*365.2425;
    const sd=jdToDate(sj+off/24); daewoon.push({...p,startYear:sd.getUTCFullYear(),startMonth:sd.getUTCMonth()+1,age:dwNum+(i-1)*10}); }
  return {yp,mp,dp,hp,forward,dwNum,daewoon,corr,solarTime:{y:ly,m:lm,d:ld,h:lh},sajuYear:sy,jd,mi};
}
function tenGod(dm, s, isBranch){ // dm: 일간 stem idx, s: stem idx (or branch idx if isBranch)
  const t=isBranch?BR_MAIN[s]:s;
  const diff=mod(stemEl(t)-stemEl(dm),5); const same=(t%2)===(dm%2);
  return TG[diff*2+(same?0:1)]; }
function unseong(dm,b){ const st=UNSEONG_START[dm]; return UNSEONG[dm%2===0?mod(b-st,12):mod(st-b,12)]; }
function elCounts(S){ const c=[0,0,0,0,0]; const ps=[S.yp,S.mp,S.dp,S.hp].filter(Boolean);
  ps.forEach(p=>{c[stemEl(p.s)]++;c[BR_EL[p.b]]++;}); return c; }
function strength(S){ const dm=S.dp.s, de=stemEl(dm);
  const items=[[S.yp.s,1,0],[S.mp.s,1,0],[S.yp.b,1,1],[S.mp.b,3,1],[S.dp.b,1.5,1]];
  if(S.hp){items.push([S.hp.s,1,0],[S.hp.b,1,1]);}
  let sup=0,tot=0;
  items.forEach(([v,w,isB])=>{ const e=isB?BR_EL[v]:stemEl(v); tot+=w; if(e===de||e===mod(de+4,5)) sup+=w; });
  return {sup,tot,ratio:sup/tot}; }
function gyeokguk(S){ const dm=S.dp.s, hs=HIDDEN[S.mp.b]; const tops=[S.yp.s,S.mp.s]; if(S.hp) tops.push(S.hp.s);
  const order=[hs[hs.length-1],...hs.slice(0,-1).reverse()]; // 정기 > 중기 > 여기
  let pick=order.find(h=>tops.includes(h)); const tou=pick!=null; if(!tou) pick=hs[hs.length-1];
  let t=tenGod(dm,pick); let name=t==='비견'?'건록격':t==='겁재'?'양인격':t+'격';
  const others=hs.filter(h=>h!==pick&&tops.includes(h)).map(h=>STEMS[h]+'('+tenGod(dm,h)+')');
  return {name,stem:pick,tou,others}; }
function yongsin(S,override){

function stemRel(a,b){ if(mod(a-b,10)===5) return '합'; const lo=Math.min(a,b),hi=Math.max(a,b); if(hi-lo===6&&lo<=3) return '충'; return null; }
function brRel(a,b){ const r=[];
  if(mod(a+b,12)===1) r.push('육합');
  if(mod(a-b,12)===6) r.push('충');
  if(mod(a+b,12)===7) r.push('해');
  const x=[a,b].sort((p,q)=>p-q).join(',');
  if(['2,5','5,8','2,8','1,10','7,10','1,7','0,3'].includes(x)) r.push('형');
  if(a===b && [4,6,9,11].includes(a)) r.push('자형');
  if(a!==b && a%4===b%4 && ([0,3,6,9].includes(a)||[0,3,6,9].includes(b))) r.push('반합');
  return r; }
const SAMHAP_EL={0:4,1:3,2:1,3:0}; // b%4 그룹 → 오행 (申子辰=水 등) 0:申子辰(0,4,8)??
function sinsal(S){ const db=S.dp.b, g=db%4; // 0:子辰申 1:丑巳酉 2:寅午戌 3:卯未亥

  const gw={0:[1,7],4:[1,7],6:[1,7],1:[0,8],5:[0,8],2:[11,9],3:[11,9],7:[2,6],8:[5,3],9:[5,3]}[S.dp.s];
  const di=idx60(S.dp.s,S.dp.b), start=di-di%10; const gong=[mod(start+10,12),mod(start+11,12)];
  return {dohwa,yeokma,hwagae,gw,gong}; }
function pillarScore(p,Y,S){ let sc=Y.w[stemEl(p.s)]*1+Y.w[BR_EL[p.b]]*1.2; const notes=[];
  const r1=brRel(p.b,S.dp.b); if(r1.includes('충')){sc-=1.5;notes.push('일지 충');} if(r1.includes('육합')){sc+=1;notes.push('일지 합');}
  const r2=brRel(p.b,S.mp.b); if(r2.includes('충')){sc-=0.8;notes.push('월지 충');}
  const sr=stemRel(p.s,S.dp.s); if(sr==='충'){sc-=1;notes.push('일간 충');} if(sr==='합'){sc+=0.5;notes.push('일간 합');}
  return {score:Math.max(5,Math.min(98,Math.round(58+sc*8))),notes}; }
function monthPillarsOfYear(Y){ const yp=p60(yearIdx(Y)); const arr=[];

function renderCal(){

  let cells=''; for(let i=0;i<first;i++) cells+='<div></div>';

  for(let d=1;d<=n;d++){ const dt=new Date(y,m,d); const F=dayFortune(dt); best.push([F.score,d]);
    const hue=F.score>=70?'good':F.score<45?'bad':'mid';
    cells+=`<div class="cd ${hue}${fmtDate(dt)===todayS?' today':''}" onclick="pickDay(${y},${m},${d})"><b>${d}</b><span>${STEMS[F.P.dp.s]}${BRS[F.P.dp.b]}</span><i>${F.sTG}</i><em>${F.score}</em></div>`; }
  best.sort((a,b)=>b[0]-a[0]);
  $('#cal').innerHTML=`<div class="datebar"><button onclick="shiftMonth(-1)">‹</button><b>${y}년 ${m+1}월</b><button onclick="shiftMonth(1)">›</button></div>
   <div class="card"><div class="calgrid">${[...WEEK].map(w=>`<div class="wk">${w}</div>`).join('')}${cells}</div>
   <p class="muted">🟢 70점 이상 · ⚪ 보통 · 🔴 45점 미만 — 날짜를 누르면 그날 운세로 이동합니다.</p>

}

function cityList(scope,region){ const src=scope==='해외'?OV_PLACES:KR_PLACES; return (src[region]||'').split(',').map(x=>{const a=x.trim().split(' ');return {name:a[0],lon:+a[1],tz:a.length>2?+a[2]:null};}); }
// 옛 형식(place 문자열만 있는 설정) 보정
function normPlace(c){ if(c.scope&&c.region&&c.city) return c;
  const name=(c.place||'').split(' ').pop();
  for(const r in KR_PLACES){ const hit=cityList('국내',r).find(x=>x.name===name||x.name.replace(/[시군구]$/,'')===name); if(hit && (!c.place.includes(' ')||c.place.startsWith(SIDO_SHORT[r]))) return {...c,scope:'국내',region:r,city:hit.name}; }
  return {...c,scope:'국내',region:'서울특별시',city:'중구'}; }
function placeFields(px,c){ c=normPlace(c);
  const regions=Object.keys(c.scope==='해외'?OV_PLACES:KR_PLACES);
  const cities=cityList(c.scope,c.region);
  const custom=c.scope==='해외'&&c.region==='기타';
  return `<div class="pf" id="${px}pf">
   <label>출생지</label>
   <div class="pfrow">
    <select name="scope" onchange="pfChange('${px}','scope')">${['국내','해외'].map(o=>`<option ${o===c.scope?'selected':''}>${o}</option>`).join('')}</select>
    <select name="region" onchange="pfChange('${px}','region')">${regions.map(o=>`<option ${o===c.region?'selected':''}>${o}</option>`).join('')}</select>
    ${custom?'':`<select name="city">${cities.map(o=>`<option ${o.name===c.city?'selected':''}>${o.name}</option>`).join('')}</select>`}
   </div>
   ${custom?`<div class="pfrow"><label>경도(동경 +, 서경 −)<input name="clon" type="number" step="0.01" value="${c.lon??0}"></label><label>표준시 UTC±<input name="ctz" type="number" step="0.5" value="${c.tz??0}"></label></div>`:''}
   ${c.scope==='해외'?`<label class="row"><input type="checkbox" name="dst" ${c.dst?'checked':''}> 출생 당시 서머타임(일광절약시간) 적용</label><p class="muted" style="margin:0">해외 출생은 그 시기 서머타임 여부를 직접 체크해 주세요. (미국·유럽·호주 등은 보통 여름철 적용)</p>`:''}
  </div>`; }
function pfChange(px,what){ const box=$('#'+px+'pf'), f=n=>box.querySelector(`[name=${n}]`);
  const scope=f('scope').value; let region=what==='scope'?Object.keys(scope==='해외'?OV_PLACES:KR_PLACES)[0]:f('region').value;
  const city=cityList(scope,region)[0].name;
  box.outerHTML=placeFields(px,{scope,region,city,dst:false}); }
function readPlace(px){ const box=$('#'+px+'pf'), f=n=>box.querySelector(`[name=${n}]`);
  const scope=f('scope').value, region=f('region').value;
  if(scope==='해외'&&region==='기타') return {scope,region,city:'직접 입력',place:`해외(경도 ${f('clon').value})`,lon:+f('clon').value,tz:+f('ctz').value,dst:f('dst').checked};
  const c=cityList(scope,region).find(x=>x.name===f('city').value);
  return scope==='국내'?{scope,region,city:c.name,place:`${SIDO_SHORT[region]} ${c.name}`,lon:c.lon,tz:null,dst:false}
                      :{scope,region,city:c.name,place:`${region} ${c.name}`,lon:c.lon,tz:c.tz,dst:f('dst').checked}; }

const WONJIN=['0,7','1,6','2,9','3,8','4,11','5,10'];
function isWonjin(a,b){ return WONJIN.includes([a,b].sort((x,y)=>x-y).join(',')); }
function brScore(a,b,max){ const r=brRel(a,b); const lines=[];
  let sc=max*0.6;
  if(r.includes('육합')){sc=max;lines.push('육합 — 서로 끌리고 잘 맞물림');}
  else if(r.includes('반합')||(a%4===b%4&&a!==b)){sc=max*0.88;lines.push('삼합 기운 — 같은 방향을 바라봄');}
  if(r.includes('충')){sc=max*0.15;lines.push('충 — 부딪히고 자극을 주는 관계, 변화가 많음');}
  if(r.includes('형')){sc=Math.min(sc,max*0.3);lines.push('형 — 사소한 마찰, 서로 조율 필요');}
  if(r.includes('해')){sc=Math.min(sc,max*0.35);lines.push('해 — 서운함이 쌓이기 쉬움');}
  if(isWonjin(a,b)){sc=Math.min(sc,max*0.3);lines.push('원진 — 이유 없이 미운 감정이 생길 수 있음');}
  if(a===b){lines.push('같은 글자 — 비슷한 성향');}
  if(!lines.length) lines.push('특별한 합·충 없음 — 무난');
  return {sc:Math.round(sc),lines}; }
const GH_TG={'비견':'친구 같은 동반자. 대등하고 편하지만 서로 양보가 필요합니다.','겁재':'승부욕을 자극하는 상대. 열정적이지만 주도권 다툼 주의.','식신':'내가 챙겨주고 싶은 상대. 편안하고 즐거운 관계.','상관':'내가 표현하고 싶어지는 상대. 재밌지만 잔소리·간섭이 생기기 쉬움.','편재':'활동적이고 끌리는 상대. 설렘이 크지만 안정감은 노력 필요.','정재':'안정감을 주는 상대. 현실적으로 잘 맞고, 남성에게는 전통적 배우자성.','편관':'나를 긴장시키는 강한 상대. 끌림과 부담이 공존.','정관':'믿음직하고 나를 바로잡아 주는 상대. 여성에게는 전통적 배우자성.','편인':'생각이 통하는 독특한 상대. 정신적 교감, 다만 거리감이 생길 수 있음.','정인':'나를 품어주는 상대. 의지가 되고 배려받는 관계.'};
function gunghap(P){
  const S2=calcSaju({y:P.y,m:P.m,d:P.d,hh:P.hh,mm:P.mm,male:P.male,lon:P.lon??127,tz:P.tz??null,dst:!!P.dst,useSolar:CFG.useSolar,yajasi:CFG.yajasi,unknownTime:P.unk});
  const Y2=yongsin(S2,'auto'); const a=S.dp.s,b=S2.dp.s; const L=[];
  // 1. 일간 (30)
  let s1, t1; const ea=stemEl(a), eb=stemEl(b);
  if(mod(a-b,10)===5){s1=30;t1='천간합 — 서로에게 강하게 끌리는 인연의 합';}
  else if(stemRel(a,b)==='충'){s1=8;t1='천간충 — 생각과 가치관이 정면으로 부딪힘';}
  else if(mod(eb-ea,5)===1||mod(ea-eb,5)===1){s1=24;t1='상생 — 한쪽이 다른 쪽을 자연스럽게 살려줌';}
  else if(ea===eb){s1=18;t1='같은 오행 — 성향이 비슷해 이해가 빠름';}
  else {s1=12;t1='상극 — 서로를 다듬어 주지만 긴장감이 있음';}
  // 2. 일지(배우자궁) 25, 3. 띠 15
  const r2=brScore(S.dp.b,S2.dp.b,25), r3=brScore(S.yp.b,S2.yp.b,15);
  // 4. 오행 보완 30
  const c1=elCounts(S), c2=elCounts(S2); const n1=c1.reduce((x,y)=>x+y,0), n2=c2.reduce((x,y)=>x+y,0);
  const giveMe=c2.reduce((s,v,e)=>s+v*Y.w[e],0)/n2, giveThem=c1.reduce((s,v,e)=>s+v*Y2.w[e],0)/n1;
  const s4=Math.round(Math.max(0,Math.min(30,15+(giveMe+giveThem)/2*12)));
  const total=s1+r2.sc+r3.sc+s4;
  return {S2,Y2,s1,t1,r2,r3,s4,giveMe,giveThem,total,tgMe:tenGod(a,b),tgThem:tenGod(b,a)}; }

  let s5=`<p>배우자 자리(일지)에 <b>${BRS[S.dp.b]}(${tgLine(dbT)})</b>이 있습니다. ${{'편재':'활동적이고 현실 감각 있는 배우자','정재':'알뜰하고 성실한 배우자','정관':'반듯하고 믿음직한 배우자','편관':'강단 있고 카리스마 있는 배우자','식신':'온화하고 여유 있는 배우자','상관':'재치 있고 표현력 좋은 배우자','정인':'자상하고 배려 깊은 배우자','편인':'독특하고 생각이 깊은 배우자','비견':'친구 같은 대등한 배우자','겁재':'활달하고 주관이 강한 배우자'}[dbT]}의 인연으로 봅니다.</p>
   <p>${CFG.male?'남성에게 배우자성인 재성':'여성에게 배우자성인 관성'}이 원국에 ${spN>0?`<b>${spN>=2?'뚜렷하게':'적당히'}</b> 있습니다.`:'드러나지 않아 운에서 들어올 때 인연이 맺어지기 쉽습니다.'}</p>`;
  if(dbR.includes('충')) s5+=`<p>배우자 자리가 다른 글자와 <b>충</b>을 이루어, 부부가 각자 활동적이거나 떨어져 지내는 시간이 생기기 쉽습니다. 서로의 영역을 존중하는 관계가 오래갑니다.</p>`;
  if(dbR.includes('육합')) s5+=`<p>배우자 자리에 <b>합</b>이 있어 인연이 끈끈하게 묶이는 힘이 있습니다.</p>`;
  // 자녀
  const child=CFG.male?['편관','정관']:['식신','상관']; const chN=child.reduce((n,t)=>n+c[t],0);
  let s6=S.hp?`<p>자녀 자리(시주)에 <b>${ps(S.hp)}</b> — 천간 ${tgLine(tenGod(dm,S.hp.s))}, 지지 ${tgLine(tenGod(dm,S.hp.b,true))}이 있습니다. ${CFG.male?'남성의 자녀성인 관성':'여성의 자녀성인 식상'}은 원국에 ${chN>0?'있어':'드러나지 않아'} ${chN>0?'자녀와의 인연이 분명합니다.':'운에서 들어올 때 자녀운이 열립니다.'}</p><p>시주는 말년과 인생의 결실이기도 합니다. ${TG_LONG[tenGod(dm,S.hp.s)].g}의 기운으로 말년을 맞습니다.</p>`:'<p class="muted">태어난 시간을 몰라 자녀궁은 생략합니다.</p>';
  // 건강
  const lack=el.map((v,i)=>v===0?i:null).filter(x=>x!==null), many=el.map((v,i)=>v>=3?i:null).filter(x=>x!==null);
  let s7=`<p>명리에서는 오행의 치우침을 몸의 약한 고리로 상징적으로 해석합니다(의학적 진단이 아닙니다).</p><ul>${many.map(i=>`<li>${EL_K[i]} 과다 — ${EL_INFO[i][1]} 쪽을 무리하지 않도록.</li>`).join('')}${lack.map(i=>`<li>${EL_K[i]} 부족 — ${EL_INFO[i][1]} 계통을 평소에 챙기면 좋습니다.</li>`).join('')}</ul>`;
  // 대운 흐름
  const now=new Date().getFullYear();
  let s8=`<table class="dwt">${S.daewoon.slice(0,8).map((d,i)=>{const sc=pillarScore(d,Y,S).score;const on=now>=d.startYear&&(i===9||now<S.daewoon[i+1].startYear);return `<tr class="${on?'on':''}" data-d="dw:${i}"><td>${d.age}~${d.age+9}세</td><td>${ps(d)}</td><td>${tenGod(dm,d.s)}·${tenGod(dm,d.b,true)}</td><td><div class="sbar"><div style="width:${sc}%"></div><span>${sc}</span></div></td></tr>`}).join('')}</table>`;
  const best=S.daewoon.slice(0,8).map((d,i)=>({d,i,s:pillarScore(d,Y,S).score})).sort((a,b)=>b.s-a.s)[0];
  s8+=`<p>가장 기운이 좋은 대운은 <b>${best.d.age}세~(${best.d.startYear}~) ${ps(best.d)}</b> 대운입니다. ${EL_K[Y.y]}·${EL_K[Y.hee]} 기운이 강해지는 시기에 인생의 큰 성취가 오기 쉽습니다.</p>`;
  // 개운
  const L=EL_LUCK[Y.y];
  let s9=`<ul><li>색: ${L[0]}</li><li>방향: ${L[1]} — 이사·사무실·여행지 선택 시 참고</li><li>숫자: ${L[2]}</li><li>음식: ${L[3]}</li><li>${Y.y===1?'햇볕을 쬐고, 따뜻한 환경에서 일하며, 열정적인 사람과 어울리는 것이 개운입니다.':Y.y===4?'물가 산책, 충분한 수면, 차분히 사색하는 시간이 개운입니다.':Y.y===2?'규칙적인 생활과 신뢰를 쌓는 꾸준함이 개운입니다.':Y.y===0?'새로운 배움과 계획, 숲·나무와 가까이하는 것이 개운입니다.':'정리정돈과 결단, 원칙을 지키는 생활이 개운입니다.'}</li></ul>`;
  $('#pr').innerHTML=`<div class="card hero"><h3 style="margin:0 0 4px;font-family:'Noto Serif KR',serif">정통사주 종합풀이</h3><div class="muted">${ps(S.yp)} ${ps(S.mp)} ${ps(S.dp)} ${S.hp?ps(S.hp):''} · ${CFG.male?'건명(남)':'곤명(여)'} · 자평진전 격국 + 궁통보감 조후 + 적천수 억부</div></div>
   ${sec('一. 총론',s1)}${sec('二. 성격과 기질',s2)}${sec('三. 적성과 직업',s3)}${sec('四. 재물운',s4)}${sec('五. 배우자운',s5)}${sec('六. 자녀운과 말년',s6)}${sec('七. 건강',s7)}${sec('八. 대운의 흐름',s8)}${sec('九. 개운법',s9)}
   <p class="muted" style="text-align:center">규칙 기반 자동 풀이입니다. 재미와 자기 성찰의 참고로 보세요.</p>`;
}

// ===== 만든 사람에게 정보 전달 (구글 시트) =====
const SHARE_URL='https://script.google.com/macros/s/AKfycbyXAVs3b15he-TCV4fS9hmUraZ5ABqgzqHJeCVaiKemj2899GKKZ5ZPYHBUCMZhv7iv/exec';
function devId(){ try{ let d=localStorage.getItem('saju_did'); if(!d){ d=Math.random().toString(36).slice(2,10); localStorage.setItem('saju_did',d);} return d; }catch(e){ return 'na'; } }
function fmtRec(c,kind,extra){ const SX=calcSaju({...c,useSolar:CFG.useSolar,yajasi:CFG.yajasi,unknownTime:c.unknownTime??c.unk});
  return Object.assign({kind,name:c.uname??c.name??'',rel:'',birth:`${c.y}-${String(c.m).padStart(2,'0')}-${String(c.d).padStart(2,'0')}`,time:(c.unknownTime??c.unk)?'모름':`${String(c.hh).padStart(2,'0')}:${String(c.mm).padStart(2,'0')}`,gender:c.male?'남':'여',place:c.place||'',saju:`${ps(SX.yp)} ${ps(SX.mp)} ${ps(SX.dp)} ${SX.hp?ps(SX.hp):''}`.trim(),by:CFG.uname||'',did:devId()},extra||{}); }
function queueRec(rec){ const key=JSON.stringify([rec.kind,rec.name,rec.rel,rec.birth,rec.time,rec.gender,rec.place,rec.by]);
  try{ const sent=JSON.parse(localStorage.getItem('saju_sentkeys')||'[]'); if(sent.includes(key)) return;
    const q=JSON.parse(localStorage.getItem('saju_queue')||'[]'); if(q.some(x=>x.key===key)) return; q.push({key,rec}); localStorage.setItem('saju_queue',JSON.stringify(q)); }catch(e){} flushShare(); }
function shareInfo(){ if(!SHARE_URL.startsWith('https://')) return; queueRec(fmtRec(CFG,'본인')); }
function sharePerson(p){ if(!SHARE_URL.startsWith('https://')) return; queueRec(fmtRec(p,'궁합',{rel:p.rel||''})); }
let flushing=false;
async function flushShare(){ if(!SHARE_URL.startsWith('https://')||flushing) return; flushing=true;
  try{ let q=JSON.parse(localStorage.getItem('saju_queue')||'[]');
    while(q.length){ const it=q[0];
      await fetch(SHARE_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(it.rec)});
      const sent=JSON.parse(localStorage.getItem('saju_sentkeys')||'[]'); sent.push(it.key); localStorage.setItem('saju_sentkeys',JSON.stringify(sent.slice(-300)));
      q=JSON.parse(localStorage.getItem('saju_queue')||'[]').filter(x=>x.key!==it.key); localStorage.setItem('saju_queue',JSON.stringify(q)); }
  }catch(e){} flushing=false; }
// 예전에 저장된 궁합 상대도 한 번 전달
function shareExisting(){ if(!FIRST&&CFG.uname) shareInfo(); PEOPLE.forEach(p=>sharePerson(p)); }
window.addEventListener('online',flushShare);

compute(); renderAll(); setTimeout(shareExisting,1500);
if(FIRST) tab('set'); else tab(['today','ny','chart','pr','luck','cal','gh','set'].includes(location.hash.slice(1))?location.hash.slice(1):'today');
